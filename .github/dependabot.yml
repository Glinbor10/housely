version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '21:00'
      timezone: Europe/Madrid
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: '21:00'
      timezone: Europe/Madrid
    groups:
      github-actions:
        patterns: ['*']

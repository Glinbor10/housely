docs:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'LICENSE']

infra:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'firebase/**', 'firestore.*']

quality:
  - changed-files:
      - any-glob-to-any-file: ['**/*.test.ts', '**/*.test.tsx', '.oxlintrc.json', '.editorconfig']

security:
  - changed-files:
      - any-glob-to-any-file: ['.github/SECURITY.md', 'firestore.rules']

pwa:
  - changed-files:
      - any-glob-to-any-file: ['public/manifest*', 'src/sw*']

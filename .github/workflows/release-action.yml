name: Release Action

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (tests and dependency audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  release:
    name: Create release and deploy to production
    runs-on: ubuntu-latest
    needs: [verify]
    # Configure required reviewers on this environment to approve every production deploy
    environment: production
    permissions:
      contents: write
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD != '' && vars.FIREBASE_PROJECT_PROD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Read version
        run: echo "TAG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      - name: Deploy to Firebase Hosting (production project)
        if: ${{ env.HAS_FIREBASE == 'true' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          projectId: ${{ vars.FIREBASE_PROJECT_PROD }}
          channelId: live

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${TAG_VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Release ${TAG_VERSION}" \
            --generate-notes \
            --notes "[GitHub Action Info](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"

      - name: Increment version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: auto increment app version [skip ci]"
          git push

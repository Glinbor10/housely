name: Main merge

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# Never run two CI deployments at the same time
concurrency:
  group: deploy-ci
  cancel-in-progress: false

jobs:
  deploy-ci:
    name: Deploy to CI environment
    runs-on: ubuntu-latest
    environment: ci
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSELY_CI != '' && vars.FIREBASE_PROJECT_CI != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      - name: Deploy to Firebase Hosting (CI project)
        if: ${{ env.HAS_FIREBASE == 'true' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: firebase
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSELY_CI }}
          projectId: ${{ vars.FIREBASE_PROJECT_CI }}
          channelId: live

      # Rules and indexes go out before the tests that depend on them. Controlled by the repository
      # variable FIRESTORE_DEPLOY_ENABLED: the service account needs the Firebase Rules Admin and
      # Cloud Datastore Index Admin roles (see docs/configuration-management/configuration-management.adoc).
      - name: Deploy Firestore rules and indexes
        if: ${{ env.HAS_FIREBASE == 'true' && vars.FIRESTORE_DEPLOY_ENABLED == 'true' }}
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSELY_CI }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"             npx -y firebase-tools@15.34.0 --config firebase/firebase.json deploy --only firestore --non-interactive             --project "${{ vars.FIREBASE_PROJECT_CI }}"
          rm -f "$RUNNER_TEMP/service-account.json"

      - name: Install the browsers for the end-to-end tests
        if: ${{ env.HAS_FIREBASE == 'true' }}
        run: npx playwright install --with-deps chromium webkit

      # The CI environment itself, right after the deploy
      - name: End-to-end tests on the CI environment
        if: ${{ env.HAS_FIREBASE == 'true' }}
        run: npm run e2e
        env:
          E2E_BASE_URL: https://${{ vars.FIREBASE_PROJECT_CI }}.web.app

      - name: Upload the end-to-end report
        if: ${{ failure() && env.HAS_FIREBASE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Skip notice
        if: ${{ env.HAS_FIREBASE != 'true' }}
        run: echo "::notice::Firebase CI secret or variable not configured; build verified but not deployed."

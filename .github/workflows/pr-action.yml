name: PR Action

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    # Skip CI when the PR title contains [skip-ci]
    if: ${{ !contains(github.event.pull_request.title, '[skip-ci]') }}
    env:
      # Preview deploys are skipped until the Firebase secret/variable exist.
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSELY_CI != '' && vars.FIREBASE_PROJECT_CI != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Deploy preview channel
        if: ${{ env.HAS_FIREBASE == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSELY_CI }}
          projectId: ${{ vars.FIREBASE_PROJECT_CI }}
          expires: 7d

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.title, '[skip-ci]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.34.0

      - run: npm ci
      - run: npm run test:rules

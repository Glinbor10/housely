name: PR Automation

# pull_request_target runs the workflow from the base branch and gets a write token even for bot PRs.
# It never checks out or runs code from the PR, so it is safe to use here.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  automate:
    name: Assign, label and sync metadata
    runs-on: ubuntu-latest
    steps:
      - name: Assign the author (the repo owner for bot PRs)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const assignee = pr.user.type === 'Bot' ? context.repo.owner : pr.user.login
            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: pr.number,
              assignees: [assignee],
            })

      - name: Label by changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Copy milestone and labels from the linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const match = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i.exec(pr.body ?? '')
            if (!match) return
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: Number(match[1]),
            })
            const labels = issue.labels.map((label) => (typeof label === 'string' ? label : label.name))
            await github.rest.issues.update({
              ...context.repo,
              issue_number: pr.number,
              milestone: issue.milestone?.number ?? null,
            })
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels,
              })
            }

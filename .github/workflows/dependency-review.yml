name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Blocks a PR that adds a dependency with a known vulnerability or a license we cannot use
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

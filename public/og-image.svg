<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Housely: fair weekly chores for your home">
  <!-- Template of the link preview card. `npm run icons` puts the app icon where the placeholder is and writes public/og-image.svg and og-image.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c5db8" />
      <stop offset="1" stop-color="#0f2147" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1040" cy="90" r="260" fill="#ffffff" opacity="0.06" />
  <circle cx="1130" cy="560" r="200" fill="#ffffff" opacity="0.05" />

  <g transform="translate(90 135) scale(0.72)">
    <defs><linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0fb"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#tile)"/><g transform="translate(36 12) scale(2.2)">
  <!-- Source of every app icon: edit it and run `npm run icons`. Same drawing as src/components/Mascot.tsx (happy). -->
  <ellipse cx="76" cy="190" rx="16" ry="7" fill="#ffc24a" />
  <ellipse cx="124" cy="190" rx="16" ry="7" fill="#ffc24a" />
  <rect x="132" y="36" width="22" height="44" rx="6" fill="#3d86d6" />
  <path d="M26 98 L100 32 L174 98 Z" fill="#5aa2f0" stroke="#5aa2f0" stroke-width="14" stroke-linejoin="round" />
  <rect x="38" y="86" width="124" height="104" rx="42" fill="#1f3a70" />
  <circle cx="78" cy="122" r="23" fill="#ffffff" />
  <circle cx="122" cy="122" r="23" fill="#ffffff" />
  <circle cx="79" cy="121" r="11" fill="#101a33" />
  <circle cx="121" cy="121" r="11" fill="#101a33" />
  <circle cx="83" cy="116.500" r="4.200" fill="#ffffff" />
  <circle cx="75.500" cy="125" r="1.900" fill="#ffffff" />
  <circle cx="125" cy="116.500" r="4.200" fill="#ffffff" />
  <circle cx="117.500" cy="125" r="1.900" fill="#ffffff" />
  <path d="M86 160 q14 13 28 0" fill="none" stroke="#101a33" stroke-width="5" stroke-linecap="round" />
</g>
  </g>

  <text x="510" y="250" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="700" fill="#ffffff">Housely</text>
  <text x="514" y="325" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#d6e5ff">Fair weekly chores for your home.</text>
  <text x="514" y="385" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#d6e5ff">Everybody cleans everything, in turn.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#1f3a70">
    <rect x="514" y="450" width="210" height="62" rx="31" fill="#ffffff" />
    <text x="619" y="491" text-anchor="middle">Installable</text>
    <rect x="744" y="450" width="190" height="62" rx="31" fill="#ffffff" />
    <text x="839" y="491" text-anchor="middle">Offline</text>
    <rect x="954" y="450" width="150" height="62" rx="31" fill="#ffffff" />
    <text x="1029" y="491" text-anchor="middle">Free</text>
  </g>
</svg>
